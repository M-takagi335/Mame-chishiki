<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>豆知識タイムライン</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --bg-2: #ffffff;
      --card: rgba(255, 255, 255, .94);
      --card-strong: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: rgba(17, 24, 39, .09);
      --accent: #6d5dfc;
      --accent-2: #0ea5e9;
      --accent-soft: rgba(109, 93, 252, .10);
      --danger: #e11d48;
      --shadow: 0 20px 60px rgba(17, 24, 39, .10);
      --page-bg:
        radial-gradient(circle at 15% 0%, rgba(109,93,252,.08), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(14,165,233,.06), transparent 24%),
        linear-gradient(180deg, #fbfcfe 0%, #f4f6fa 100%);
      --app-bg: rgba(255,255,255,.78);
      --topbar-bg: rgba(255,255,255,.84);
      --card-bg: linear-gradient(180deg, rgba(255,255,255,.98), rgba(250,251,253,.96));
      --card-hover-bg: linear-gradient(180deg, #ffffff, #f8faff);
      --summary: #374151;
      --tab-text: #5f6877;
      --soft-bg: rgba(17,24,39,.045);
      --modal-overlay: rgba(17,24,39,.42);
      --modal-bg: linear-gradient(180deg, rgba(255,255,255,.99), rgba(248,250,252,.99));
      --detail-text: #344054;
      --detail-summary: #1f2937;
      --accent-label: #6556de;
      --title-gradient: linear-gradient(90deg, #111827, #5b4fe0 55%, #0284c7);
      --modal-title-gradient: linear-gradient(90deg, #111827, #5b4fe0);
      --wiki-badge-bg: rgba(17,24,39,.055);
      --wiki-badge-text: #111827;
      --menu-shadow: 0 18px 60px rgba(17,24,39,.16);
    }

    html[data-theme="dark"] {
      --bg: #0b1020;
      --bg-2: #11182b;
      --card: rgba(17, 24, 39, .72);
      --card-strong: rgba(22, 30, 48, .92);
      --text: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, .14);
      --accent: #7c3aed;
      --accent-2: #22d3ee;
      --accent-soft: rgba(124, 58, 237, .14);
      --danger: #fb7185;
      --shadow: 0 24px 70px rgba(0, 0, 0, .28);
      --page-bg:
        radial-gradient(circle at 15% 0%, rgba(124,58,237,.18), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(34,211,238,.12), transparent 24%),
        linear-gradient(180deg, #0b1020 0%, #090d18 100%);
      --app-bg: rgba(7, 12, 24, .56);
      --topbar-bg: rgba(8, 13, 26, .74);
      --card-bg: linear-gradient(180deg, rgba(18,25,43,.76), rgba(13,19,33,.72));
      --card-hover-bg: linear-gradient(180deg, rgba(24,33,55,.9), rgba(15,22,38,.86));
      --summary: #cbd5e1;
      --tab-text: #cbd5e1;
      --soft-bg: rgba(148,163,184,.10);
      --modal-overlay: rgba(2, 6, 23, .72);
      --modal-bg: linear-gradient(180deg, rgba(18,25,43,.98), rgba(8,13,26,.98));
      --detail-text: #dbe4ef;
      --detail-summary: #e2e8f0;
      --accent-label: #c4b5fd;
      --title-gradient: linear-gradient(90deg, #fff, #c4b5fd 45%, #67e8f9);
      --modal-title-gradient: linear-gradient(90deg, #fff, #c4b5fd);
      --wiki-badge-bg: rgba(255,255,255,.08);
      --wiki-badge-text: #fff;
      --menu-shadow: 0 18px 60px rgba(0,0,0,.34);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
        "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    button, input { font: inherit; }

    .app {
      width: min(760px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      background: var(--app-bg);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      box-shadow: 0 0 80px rgba(0,0,0,.18);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--topbar-bg);
      backdrop-filter: blur(22px) saturate(140%);
      border-bottom: 1px solid var(--line);
      padding: 14px 18px 12px;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -.03em;
      font-weight: 850;
      background: var(--title-gradient);
      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .tab {
      border: 0;
      border-radius: 999px;
      padding: 8px 13px;
      background: var(--soft-bg);
      color: var(--tab-text);
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--accent), #5b21b6);
      color: white;
      box-shadow: 0 8px 24px rgba(124,58,237,.28);
    }

    .timeline {
      min-height: 240px;
    }

    .card {
      position: relative;
      padding: 17px 18px 15px;
      border-bottom: 1px solid var(--line);
      background: var(--card-bg);
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
      cursor: pointer;
      margin: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0,0,0,.16);
    }

    .card:hover {
      transform: translateY(-2px);
      background: var(--card-hover-bg);
      border-color: rgba(124,58,237,.35);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .word {
      margin: 0;
      font-size: 18px;
      line-height: 1.5;
      font-weight: 800;
      letter-spacing: -.01em;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .summary {
      margin: 8px 0 0;
      font-size: 15px;
      line-height: 1.6;
      color: var(--summary);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .meta {
      margin-top: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .wiki-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .fav-btn {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft-bg);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: #64748b;
      font-size: 19px;
      transition: .15s ease;
    }

    .fav-btn:hover {
      background: rgba(251,113,133,.10);
      border-color: #ffd0e4;
      color: var(--danger);
    }

    .fav-btn.active {
      color: var(--danger);
      border-color: #ffd0e4;
      background: rgba(251,113,133,.10);
    }

    .load-more-wrap {
      padding: 18px;
      background: transparent;
    }

    .load-more {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5 52%, #0891b2);
      color: white;
      font-weight: 800;
      box-shadow: 0 14px 35px rgba(79,70,229,.26);
      cursor: pointer;
    }

    .load-more:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .status {
      padding: 34px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .spinner {
      width: 26px;
      height: 26px;
      margin: 0 auto 12px;
      border: 3px solid #dbe7ef;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: var(--modal-overlay);
      backdrop-filter: blur(10px);
    }

    .modal.show { display: flex; }

    .modal-panel {
      width: min(680px, 100%);
      max-height: min(82vh, 820px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--modal-bg);
      border: 1px solid rgba(148,163,184,.18);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,.22);
    }

    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .modal-title {
      margin: 0;
      font-size: 23px;
      line-height: 1.35;
      overflow-wrap: anywhere;
      white-space: normal;
    }

    .close-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 999px;
      background: var(--soft-bg);
      cursor: pointer;
      font-size: 20px;
    }

    .modal-body {
      overflow-y: auto;
      padding: 18px 20px 24px;
    }

    .detail-text {
      margin: 0;
      white-space: pre-wrap;
      font-size: 15px;
      line-height: 1.8;
      color: var(--detail-text);
    }


    .detail-block {
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }

    .detail-block:first-child { padding-top: 0; }

    .detail-label {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 5px 9px;
      margin-bottom: 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-label);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .detail-summary {
      margin: 0;
      font-size: 17px;
      line-height: 1.75;
      font-weight: 650;
      color: var(--detail-summary);
    }

    .detail-loading {
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 12px;
      background: var(--soft-bg);
      color: var(--muted);
      font-size: 13px;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .action {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 800;
      text-decoration: none;
      font-size: 13px;
    }

    .action.primary {
      background: var(--accent);
      color: white;
    }

    .action.secondary {
      background: var(--soft-bg);
      color: var(--detail-summary);
    }

    .empty-note {
      padding: 48px 22px;
      text-align: center;
      color: var(--muted);
      line-height: 1.8;
    }


    .topbar::after {
      content: "";
      position: absolute;
      left: 18px; right: 18px; bottom: -1px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(124,58,237,.7), rgba(34,211,238,.55), transparent);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      border-radius: 20px 0 0 20px;
      background: linear-gradient(180deg, #8b5cf6, #22d3ee);
      opacity: .75;
    }

    .wiki-label::before {
      content: "!";
      width: 20px; height: 20px;
      border-radius: 7px;
      display: inline-grid;
      place-items: center;
      font-family: Georgia, serif;
      font-weight: 700;
      color: var(--wiki-badge-text);
      background: var(--wiki-badge-bg);
      border: 1px solid var(--line);
    }

    .load-more {
      transition: transform .18s ease, filter .18s ease;
    }

    .load-more:hover { transform: translateY(-1px); filter: brightness(1.06); }

    .modal-title {
      background: var(--modal-title-gradient);
      -webkit-background-clip: text;
      color: transparent;
    }

    .menu-wrap {
      position: relative;
      flex: 0 0 auto;
    }

    .menu-button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--soft-bg);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease;
    }

    .menu-button:hover { transform: translateY(-1px); }

    .hamburger {
      width: 18px;
      display: grid;
      gap: 4px;
    }

    .hamburger span {
      display: block;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
    }

    .menu-panel {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 230px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card-strong);
      box-shadow: var(--menu-shadow);
      opacity: 0;
      transform: translateY(-6px) scale(.98);
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }

    .menu-panel.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .menu-title {
      padding: 6px 8px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .theme-option {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 0;
      border-radius: 13px;
      padding: 11px 12px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      font-weight: 700;
    }

    .theme-option:hover { background: var(--soft-bg); }

    .theme-option.active {
      background: var(--accent-soft);
      color: var(--accent-label);
    }

    .theme-option .check {
      opacity: 0;
      font-weight: 900;
    }

    .theme-option.active .check { opacity: 1; }

    .search-shell {
      margin-top: 0;
    }

    .search-toggle {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 50%;
      padding: 0;
      display: grid;
      place-items: center;
      background: var(--soft-bg);
      color: var(--text);
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }

    .search-toggle:hover {
      background: var(--accent-soft);
      border-color: rgba(109,93,252,.28);
    }

    .search-toggle:active {
      transform: scale(.96);
    }

    .search-toggle-icon {
      width: 18px;
      height: 18px;
      display: block;
    }

    .search-toggle-icon::before {
      content: "";
      display: block;
      width: 10px;
      height: 10px;
      border: 2px solid currentColor;
      border-radius: 50%;
      transform: translate(1px, 1px);
    }

    .search-toggle-icon::after {
      content: "";
      display: block;
      width: 7px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
      transform: translate(11px, 0px) rotate(45deg);
      transform-origin: left center;
    }

    .search-toggle-label,
    .search-toggle-arrow {
      display: none;
    }

    .search-panel {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      margin-top: 0;
      transition: grid-template-rows .2s ease, opacity .16s ease, margin-top .2s ease;
    }

    .search-panel.open {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 10px;
    }

    .search-panel-inner {
      min-height: 0;
      overflow: hidden;
    }

    .genre-search {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 9px;
    }

    .genre-input {
      width: 100%;
      min-width: 0;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 14px;
      outline: none;
      background: var(--card-strong);
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
      transition: border-color .16s ease, box-shadow .16s ease;
    }

    .genre-input::placeholder { color: var(--muted); }

    .genre-input:focus {
      border-color: rgba(109,93,252,.55);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .genre-submit {
      height: 44px;
      border: 0;
      border-radius: 14px;
      padding: 0 17px;
      cursor: pointer;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: white;
      box-shadow: 0 10px 24px rgba(79,70,229,.22);
    }

    .genre-state {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 9px;
      padding: 8px 10px 8px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--soft-bg);
      color: var(--muted);
      font-size: 12px;
    }

    .genre-state.show { display: flex; }

    .genre-state strong { color: var(--text); }

    .genre-clear {
      border: 0;
      background: transparent;
      color: var(--accent-label);
      cursor: pointer;
      font-weight: 800;
      padding: 3px 5px;
    }

    @media (max-width: 640px) {
      .app { border: 0; }
      .topbar { padding-inline: 15px; }
      .card { padding-inline: 15px; }
      .word { font-size: 18px; }
      .summary { font-size: 14px; }
      .modal { padding: 0; align-items: flex-end; }
      .modal-panel {
        width: 100%;
        max-height: 88vh;
        border-radius: 22px 22px 0 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="topbar-row">
        <div>
          <h1>豆知識タイムライン</h1>
          <p class="subtitle">Random Useless Factsから毎回取得。知ると誰かに話したくなる豆知識を流し読み。</p>
        </div>
        <div class="topbar-actions">
          <button id="searchToggle" class="search-toggle" type="button"
            aria-label="検索を開く" aria-expanded="false" aria-controls="searchPanel">
            <span class="search-toggle-icon" aria-hidden="true"></span>
          </button>

          <div class="menu-wrap">
            <button id="menuButton" class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false">
              <span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span>
            </button>
            <div id="menuPanel" class="menu-panel" aria-hidden="true">
              <div class="menu-title">表示テーマ</div>
              <button class="theme-option" type="button" data-theme-option="light">
                <span>☀️ ライト</span><span class="check">✓</span>
              </button>
              <button class="theme-option" type="button" data-theme-option="dark">
                <span>🌙 ダーク</span><span class="check">✓</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="search-shell">
        <div id="searchPanel" class="search-panel" aria-hidden="true">
          <div class="search-panel-inner">
            <form id="genreForm" class="genre-search" role="search">
              <input id="genreInput" class="genre-input" type="search" autocomplete="off"
                placeholder="例：動物、宇宙、食べ物、歴史" aria-label="ジャンルまたはタイトル" />
              <button id="genreSubmit" class="genre-submit" type="submit">決定</button>
            </form>
          </div>
        </div>
      </div>

      <div id="genreState" class="genre-state" aria-live="polite">
        <span>表示中：<strong id="genreLabel"></strong></span>
        <button id="genreClear" class="genre-clear" type="button">解除</button>
      </div>

      <div class="tabs" aria-label="表示切り替え">
        <button class="tab active" data-tab="timeline">タイムライン</button>
        <button class="tab" data-tab="favorites">お気に入り</button>
      </div>
    </header>

    <section id="timeline" class="timeline" aria-live="polite"></section>

    <div id="loadMoreWrap" class="load-more-wrap">
      <button id="loadMoreBtn" class="load-more">さらに1件読み込む</button>
    </div>
  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-panel">
      <div class="modal-head">
        <h2 id="modalTitle" class="modal-title"></h2>
        <button id="closeModalBtn" class="close-btn" aria-label="閉じる">×</button>
      </div>
      <div class="modal-body">
        <section class="detail-block detail-overview">
          <div class="detail-label">概要</div>
          <p id="modalSummary" class="detail-summary"></p>
        </section>
        <section class="detail-block">
          <div class="detail-label">もう少し詳しく</div>
          <p id="modalText" class="detail-text"></p>
          <div id="detailLoading" class="detail-loading" hidden>詳しい解説を読み込み中…</div>
        </section>
        <div class="modal-actions">
          <a id="wikiLink" class="action primary" target="_blank" rel="noopener noreferrer">
            出典・参考を開く
          </a>
          <button id="modalFavBtn" class="action secondary">☆ お気に入りに保存</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const PAGE_SIZE = 1;
    const timelineEl = document.getElementById("timeline");
    const loadMoreBtn = document.getElementById("loadMoreBtn");
    const loadMoreWrap = document.getElementById("loadMoreWrap");
    const tabs = [...document.querySelectorAll(".tab")];
    const menuButton = document.getElementById("menuButton");
    const menuPanel = document.getElementById("menuPanel");
    const themeOptions = [...document.querySelectorAll("[data-theme-option]")];
    const searchToggle = document.getElementById("searchToggle");
    const searchPanel = document.getElementById("searchPanel");
    const genreForm = document.getElementById("genreForm");
    const genreInput = document.getElementById("genreInput");
    const genreState = document.getElementById("genreState");
    const genreLabel = document.getElementById("genreLabel");
    const genreClear = document.getElementById("genreClear");
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalSummary = document.getElementById("modalSummary");
    const modalText = document.getElementById("modalText");
    const detailLoading = document.getElementById("detailLoading");
    const wikiLink = document.getElementById("wikiLink");
    const modalFavBtn = document.getElementById("modalFavBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");

    let items = [], currentTab = "timeline", activeItem = null, currentGenre = "", loading = false;
    const SEEN_KEY = "evidence-trivia-seen-v1";
    const FAVORITES_KEY = "evidence-trivia-favorites-v1";
    const MAX_SEEN = 1000;
    let seen = new Set(loadJson(SEEN_KEY, []));

    function loadJson(key, fallback){ try { return JSON.parse(localStorage.getItem(key) || JSON.stringify(fallback)); } catch { return fallback; } }
    function saveSeen(){ try { localStorage.setItem(SEEN_KEY, JSON.stringify([...seen].slice(-MAX_SEEN))); } catch {} }
    function cleanText(v=""){ return String(v).replace(/<[^>]*>/g, " ").replace(/\s+/g, " ").trim(); }
    function hashString(str){ let h=2166136261; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36); }
    function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
    function fmt(n, digits=1){ return Number(n).toLocaleString("ja-JP", {maximumFractionDigits:digits}); }
    function fetchWithTimeout(url, timeout=9000){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),timeout); return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t)); }

    function applyTheme(theme){ const t=theme==="dark"?"dark":"light"; document.documentElement.dataset.theme=t; localStorage.setItem("trivia-theme",t); themeOptions.forEach(o=>o.classList.toggle("active",o.dataset.themeOption===t)); }
    function closeMenu(){ menuPanel.classList.remove("show"); menuPanel.setAttribute("aria-hidden","true"); menuButton.setAttribute("aria-expanded","false"); }
    menuButton.addEventListener("click",e=>{e.stopPropagation(); const open=!menuPanel.classList.contains("show"); menuPanel.classList.toggle("show",open); menuPanel.setAttribute("aria-hidden",String(!open)); menuButton.setAttribute("aria-expanded",String(open));});
    themeOptions.forEach(o=>o.addEventListener("click",()=>{applyTheme(o.dataset.themeOption);closeMenu();}));
    document.addEventListener("click",e=>{if(!e.target.closest(".menu-wrap"))closeMenu();});
    applyTheme(localStorage.getItem("trivia-theme")||"light");
    function setSearchOpen(open){ searchPanel.classList.toggle("open",open); searchPanel.setAttribute("aria-hidden",String(!open)); searchToggle.setAttribute("aria-expanded",String(open)); searchToggle.setAttribute("aria-label",open?"検索を閉じる":"検索を開く"); if(open)requestAnimationFrame(()=>genreInput.focus()); }
    searchToggle.addEventListener("click",()=>setSearchOpen(searchToggle.getAttribute("aria-expanded")!=="true"));

    function getFavorites(){ return loadJson(FAVORITES_KEY,[]); }
    function saveFavorites(v){ localStorage.setItem(FAVORITES_KEY,JSON.stringify(v)); }
    function isFavorite(item){ return getFavorites().some(x=>x.id===item.id); }
    function toggleFavorite(item){ const f=getFavorites(); const i=f.findIndex(x=>x.id===item.id); if(i>=0)f.splice(i,1); else f.unshift(item); saveFavorites(f); render(); if(activeItem?.id===item.id)updateModalFavoriteButton(); }

    const translationCache = loadJson("evidence-trivia-translations-v1", {});
    async function translateToJa(text=""){
      const source=cleanText(text).slice(0,480); if(!source)return "";
      if(translationCache[source])return translationCache[source];
      try{
        const r=await fetchWithTimeout(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(source)}&langpair=en%7Cja`,7000);
        if(!r.ok)throw new Error(); const d=await r.json(); const out=cleanText(d?.responseData?.translatedText||"");
        if(out && out.toLowerCase()!==source.toLowerCase()){ translationCache[source]=out; try{localStorage.setItem("evidence-trivia-translations-v1",JSON.stringify(translationCache));}catch{} return out; }
      }catch{}
      return source;
    }

    function makeItem({id,title,summary,detail,source,sourceName,articleTitle,tags=[]}){
      return {id,title:cleanText(title),summary:cleanText(summary),detail:cleanText(detail),source,sourceName,articleTitle:cleanText(articleTitle),tags};
    }

    // API Ninjas の API キーをここに直接埋め込む。
    // 例: const API_NINJAS_KEY = "xxxxxxxxxxxxxxxxxxxxxxxx";
    const API_NINJAS_KEY = "3hcAepfZs8jt2OtYO13kOwW92LWAurZASu66LxXD";
    const API_NINJAS_FACTS_URL = "https://api.api-ninjas.com/v1/facts";

    async function fetchApiNinjasFact(){
      if (!API_NINJAS_KEY || API_NINJAS_KEY === "YOUR_API_NINJAS_KEY") {
        throw new Error("API Ninjas のAPIキーが未設定です。HTML内の API_NINJAS_KEY にキーを設定してください。");
      }

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 9000);
      try {
        const response = await fetch(API_NINJAS_FACTS_URL, {
          signal: controller.signal,
          headers: { "X-Api-Key": API_NINJAS_KEY }
        });
        if (!response.ok) throw new Error(`API Ninjas Facts API: ${response.status}`);
        const data = await response.json();
        const raw = cleanText(Array.isArray(data) ? data[0]?.fact : data?.fact);
        if (!raw) throw new Error("豆知識を取得できませんでした。");

        const ja = await translateToJa(raw);
        const factJa = cleanText(ja || raw);
        return makeItem({
          id: `ninjas-${hashString(raw)}`,
          title: factJa,
          summary: "API Ninjas Facts API から取得した豆知識です。",
          detail: `${factJa}\n\n原文：${raw}\n\nこのFacts APIは短い事実文を返すAPIなので、ここでは取得した事実と原文を表示しています。`,
          source: "https://api-ninjas.com/api/facts",
          sourceName: "API Ninjas Facts",
          articleTitle: "Facts API",
          tags: ["豆知識", "Facts"]
        });
      } finally {
        clearTimeout(timer);
      }
    }

    async function getExternalTrivia(count=1){
      const out=[];
      let attempts=0;
      while(out.length<count && attempts<8){
        attempts++;
        try {
          const item = await fetchApiNinjasFact();
          if (!item?.id || !item.title) continue;
          if (seen.has(item.id)) continue;
          if (currentGenre) {
            const q=currentGenre.toLowerCase();
            const hay=`${item.title} ${item.detail}`.toLowerCase();
            if (!hay.includes(q)) continue;
          }
          seen.add(item.id);
          out.push(item);
        } catch (error) {
          if (String(error?.message||"").includes("APIキーが未設定")) throw error;
          console.warn("API Ninjas取得失敗", error);
        }
      }
      saveSeen();
      return out;
    }

    function createCard(item){
      const article=document.createElement("article"); article.className="card"; article.tabIndex=0; article.setAttribute("role","button"); article.setAttribute("aria-label",`${item.title}の解説を見る`);
      const head=document.createElement("div"); head.className="card-head"; const content=document.createElement("div"); content.style.minWidth="0";
      const title=document.createElement("h2"); title.className="word"; title.textContent=item.title; const summary=document.createElement("p"); summary.className="summary"; summary.textContent=item.summary; content.append(title,summary);
      const fav=document.createElement("button"); fav.className="fav-btn"+(isFavorite(item)?" active":""); fav.type="button"; fav.title=isFavorite(item)?"お気に入りから外す":"お気に入りに保存"; fav.textContent=isFavorite(item)?"♥":"♡"; fav.addEventListener("click",e=>{e.stopPropagation();toggleFavorite(item);}); head.append(content,fav);
      const meta=document.createElement("div"); meta.className="meta"; const source=document.createElement("span"); source.className="wiki-label"; source.textContent=item.sourceName; const more=document.createElement("span"); more.textContent="根拠・解説を見る →"; meta.append(source,more); article.append(head,meta);
      article.addEventListener("click",()=>openModal(item)); article.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openModal(item);}}); return article;
    }
    function render(){ timelineEl.innerHTML=""; const data=currentTab==="timeline"?items:getFavorites(); if(!data.length){const e=document.createElement("div");e.className="empty-note";e.textContent=currentTab==="favorites"?"まだお気に入りはありません。":"外部データから豆知識を取得しています。";timelineEl.appendChild(e);}else data.forEach(x=>timelineEl.appendChild(createCard(x))); loadMoreWrap.style.display=currentTab==="timeline"?"block":"none"; }
    function showLoading(initial=false){ if(initial)timelineEl.innerHTML=`<div class="status"><div class="spinner"></div>API Ninjas Facts から1件取得中…</div>`; loadMoreBtn.disabled=true; loadMoreBtn.textContent="API Ninjasから取得中…"; }
    async function loadMore(initial=false){ if(loading)return; loading=true; showLoading(initial&&items.length===0); try{const batch=await getExternalTrivia(PAGE_SIZE); items.push(...batch); render(); loadMoreBtn.textContent=batch.length?"さらに1件読み込む":"別の候補を探す"; if(!batch.length&&!items.length)timelineEl.innerHTML=`<div class="status">今回は候補を取得できませんでした。<br><br>「別の候補を探す」から再試行してください。</div>`;}catch(e){console.error(e);if(!items.length)timelineEl.innerHTML=`<div class="status">API Ninjasから取得できませんでした。<br><br>APIキーまたは通信環境を確認してください。</div>`;loadMoreBtn.textContent="再試行する";}finally{loading=false;loadMoreBtn.disabled=false;} }
    function openModal(item){ activeItem=item; modalTitle.textContent=item.title; modalSummary.textContent=item.summary; modalText.textContent=item.detail; detailLoading.hidden=true; wikiLink.href=item.source; wikiLink.textContent=`出典：${item.sourceName}「${item.articleTitle}」`; wikiLink.style.display="inline-flex"; updateModalFavoriteButton(); modal.classList.add("show"); modal.setAttribute("aria-hidden","false"); document.body.style.overflow="hidden"; }
    function closeModal(){modal.classList.remove("show");modal.setAttribute("aria-hidden","true");document.body.style.overflow="";activeItem=null;}
    function updateModalFavoriteButton(){if(!activeItem)return;modalFavBtn.textContent=isFavorite(activeItem)?"♥ お気に入りから外す":"☆ お気に入りに保存";}
    modalFavBtn.addEventListener("click",()=>activeItem&&toggleFavorite(activeItem)); closeModalBtn.addEventListener("click",closeModal); modal.addEventListener("click",e=>{if(e.target===modal)closeModal();}); document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.classList.contains("show"))closeModal();});
    tabs.forEach(tab=>tab.addEventListener("click",()=>{currentTab=tab.dataset.tab;tabs.forEach(t=>t.classList.toggle("active",t===tab));render();})); loadMoreBtn.addEventListener("click",()=>loadMore(false));
    genreForm.addEventListener("submit",e=>{e.preventDefault();currentGenre=genreInput.value.trim();items=[];genreLabel.textContent=currentGenre||"すべて";genreState.classList.toggle("show",!!currentGenre);setSearchOpen(false);loadMore(true);});
    genreClear.addEventListener("click",()=>{currentGenre="";genreInput.value="";genreState.classList.remove("show");items=[];loadMore(true);});
    loadMore(true);
  </script>
</body>
</html>
