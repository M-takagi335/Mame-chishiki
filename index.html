<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>豆知識タイムライン</title>
  <style>
    :root {
      --bg: #f7f8fb;
      --bg-2: #ffffff;
      --card: rgba(255, 255, 255, .94);
      --card-strong: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: rgba(17, 24, 39, .09);
      --accent: #6d5dfc;
      --accent-2: #0ea5e9;
      --accent-soft: rgba(109, 93, 252, .10);
      --danger: #e11d48;
      --shadow: 0 20px 60px rgba(17, 24, 39, .10);
      --page-bg:
        radial-gradient(circle at 15% 0%, rgba(109,93,252,.08), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(14,165,233,.06), transparent 24%),
        linear-gradient(180deg, #fbfcfe 0%, #f4f6fa 100%);
      --app-bg: rgba(255,255,255,.78);
      --topbar-bg: rgba(255,255,255,.84);
      --card-bg: linear-gradient(180deg, rgba(255,255,255,.98), rgba(250,251,253,.96));
      --card-hover-bg: linear-gradient(180deg, #ffffff, #f8faff);
      --summary: #374151;
      --tab-text: #5f6877;
      --soft-bg: rgba(17,24,39,.045);
      --modal-overlay: rgba(17,24,39,.42);
      --modal-bg: linear-gradient(180deg, rgba(255,255,255,.99), rgba(248,250,252,.99));
      --detail-text: #344054;
      --detail-summary: #1f2937;
      --accent-label: #6556de;
      --title-gradient: linear-gradient(90deg, #111827, #5b4fe0 55%, #0284c7);
      --modal-title-gradient: linear-gradient(90deg, #111827, #5b4fe0);
      --wiki-badge-bg: rgba(17,24,39,.055);
      --wiki-badge-text: #111827;
      --menu-shadow: 0 18px 60px rgba(17,24,39,.16);
    }

    html[data-theme="dark"] {
      --bg: #0b1020;
      --bg-2: #11182b;
      --card: rgba(17, 24, 39, .72);
      --card-strong: rgba(22, 30, 48, .92);
      --text: #f8fafc;
      --muted: #94a3b8;
      --line: rgba(148, 163, 184, .14);
      --accent: #7c3aed;
      --accent-2: #22d3ee;
      --accent-soft: rgba(124, 58, 237, .14);
      --danger: #fb7185;
      --shadow: 0 24px 70px rgba(0, 0, 0, .28);
      --page-bg:
        radial-gradient(circle at 15% 0%, rgba(124,58,237,.18), transparent 28%),
        radial-gradient(circle at 90% 10%, rgba(34,211,238,.12), transparent 24%),
        linear-gradient(180deg, #0b1020 0%, #090d18 100%);
      --app-bg: rgba(7, 12, 24, .56);
      --topbar-bg: rgba(8, 13, 26, .74);
      --card-bg: linear-gradient(180deg, rgba(18,25,43,.76), rgba(13,19,33,.72));
      --card-hover-bg: linear-gradient(180deg, rgba(24,33,55,.9), rgba(15,22,38,.86));
      --summary: #cbd5e1;
      --tab-text: #cbd5e1;
      --soft-bg: rgba(148,163,184,.10);
      --modal-overlay: rgba(2, 6, 23, .72);
      --modal-bg: linear-gradient(180deg, rgba(18,25,43,.98), rgba(8,13,26,.98));
      --detail-text: #dbe4ef;
      --detail-summary: #e2e8f0;
      --accent-label: #c4b5fd;
      --title-gradient: linear-gradient(90deg, #fff, #c4b5fd 45%, #67e8f9);
      --modal-title-gradient: linear-gradient(90deg, #fff, #c4b5fd);
      --wiki-badge-bg: rgba(255,255,255,.08);
      --wiki-badge-text: #fff;
      --menu-shadow: 0 18px 60px rgba(0,0,0,.34);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN",
        "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }

    button, input { font: inherit; }

    .app {
      width: min(760px, 100%);
      margin: 0 auto;
      min-height: 100vh;
      background: var(--app-bg);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      box-shadow: 0 0 80px rgba(0,0,0,.18);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--topbar-bg);
      backdrop-filter: blur(22px) saturate(140%);
      border-bottom: 1px solid var(--line);
      padding: 14px 18px 12px;
    }

    .topbar-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: -.03em;
      font-weight: 850;
      background: var(--title-gradient);
      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .tab {
      border: 0;
      border-radius: 999px;
      padding: 8px 13px;
      background: var(--soft-bg);
      color: var(--tab-text);
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
    }

    .tab.active {
      background: linear-gradient(135deg, var(--accent), #5b21b6);
      color: white;
      box-shadow: 0 8px 24px rgba(124,58,237,.28);
    }

    .timeline {
      min-height: 240px;
    }

    .card {
      position: relative;
      padding: 17px 18px 15px;
      border-bottom: 1px solid var(--line);
      background: var(--card-bg);
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
      cursor: pointer;
      margin: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0,0,0,.16);
    }

    .card:hover {
      transform: translateY(-2px);
      background: var(--card-hover-bg);
      border-color: rgba(124,58,237,.35);
    }

    .card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .word {
      margin: 0;
      font-size: 18px;
      line-height: 1.5;
      font-weight: 800;
      letter-spacing: -.01em;
      overflow-wrap: anywhere;
      word-break: normal;
    }

    .summary {
      margin: 8px 0 0;
      font-size: 15px;
      line-height: 1.6;
      color: var(--summary);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }

    .meta {
      margin-top: 11px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .wiki-label {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .fav-btn {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--soft-bg);
      display: grid;
      place-items: center;
      cursor: pointer;
      color: #64748b;
      font-size: 19px;
      transition: .15s ease;
    }

    .fav-btn:hover {
      background: rgba(251,113,133,.10);
      border-color: #ffd0e4;
      color: var(--danger);
    }

    .fav-btn.active {
      color: var(--danger);
      border-color: #ffd0e4;
      background: rgba(251,113,133,.10);
    }

    .load-more-wrap {
      padding: 18px;
      background: transparent;
    }

    .load-more {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px 18px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5 52%, #0891b2);
      color: white;
      font-weight: 800;
      box-shadow: 0 14px 35px rgba(79,70,229,.26);
      cursor: pointer;
    }

    .load-more:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .status {
      padding: 34px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .spinner {
      width: 26px;
      height: 26px;
      margin: 0 auto 12px;
      border: 3px solid #dbe7ef;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: var(--modal-overlay);
      backdrop-filter: blur(10px);
    }

    .modal.show { display: flex; }

    .modal-panel {
      width: min(680px, 100%);
      max-height: min(82vh, 820px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--modal-bg);
      border: 1px solid rgba(148,163,184,.18);
      border-radius: 24px;
      box-shadow: 0 24px 80px rgba(0,0,0,.22);
    }

    .modal-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px;
      border-bottom: 1px solid var(--line);
    }

    .modal-title {
      margin: 0;
      font-size: 23px;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .close-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 999px;
      background: var(--soft-bg);
      cursor: pointer;
      font-size: 20px;
    }

    .modal-body {
      overflow-y: auto;
      padding: 18px 20px 24px;
    }

    .detail-text {
      margin: 0;
      white-space: pre-wrap;
      font-size: 15px;
      line-height: 1.8;
      color: var(--detail-text);
    }


    .detail-block {
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }

    .detail-block:first-child { padding-top: 0; }

    .detail-label {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 5px 9px;
      margin-bottom: 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-label);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .detail-summary {
      margin: 0;
      font-size: 17px;
      line-height: 1.75;
      font-weight: 650;
      color: var(--detail-summary);
    }

    .detail-loading {
      margin-top: 14px;
      padding: 11px 13px;
      border-radius: 12px;
      background: var(--soft-bg);
      color: var(--muted);
      font-size: 13px;
    }

    .modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .action {
      border: 0;
      border-radius: 999px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 800;
      text-decoration: none;
      font-size: 13px;
    }

    .action.primary {
      background: var(--accent);
      color: white;
    }

    .action.secondary {
      background: var(--soft-bg);
      color: var(--detail-summary);
    }

    .empty-note {
      padding: 48px 22px;
      text-align: center;
      color: var(--muted);
      line-height: 1.8;
    }


    .topbar::after {
      content: "";
      position: absolute;
      left: 18px; right: 18px; bottom: -1px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(124,58,237,.7), rgba(34,211,238,.55), transparent);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      border-radius: 20px 0 0 20px;
      background: linear-gradient(180deg, #8b5cf6, #22d3ee);
      opacity: .75;
    }

    .wiki-label::before {
      content: "!";
      width: 20px; height: 20px;
      border-radius: 7px;
      display: inline-grid;
      place-items: center;
      font-family: Georgia, serif;
      font-weight: 700;
      color: var(--wiki-badge-text);
      background: var(--wiki-badge-bg);
      border: 1px solid var(--line);
    }

    .load-more {
      transition: transform .18s ease, filter .18s ease;
    }

    .load-more:hover { transform: translateY(-1px); filter: brightness(1.06); }

    .modal-title {
      background: var(--modal-title-gradient);
      -webkit-background-clip: text;
      color: transparent;
    }

    .menu-wrap {
      position: relative;
      flex: 0 0 auto;
    }

    .menu-button {
      width: 42px;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--soft-bg);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform .16s ease, background .16s ease;
    }

    .menu-button:hover { transform: translateY(-1px); }

    .hamburger {
      width: 18px;
      display: grid;
      gap: 4px;
    }

    .hamburger span {
      display: block;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
    }

    .menu-panel {
      position: absolute;
      top: calc(100% + 10px);
      right: 0;
      width: 230px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--card-strong);
      box-shadow: var(--menu-shadow);
      opacity: 0;
      transform: translateY(-6px) scale(.98);
      pointer-events: none;
      transition: opacity .16s ease, transform .16s ease;
    }

    .menu-panel.show {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .menu-title {
      padding: 6px 8px 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .theme-option {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 0;
      border-radius: 13px;
      padding: 11px 12px;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      text-align: left;
      font-weight: 700;
    }

    .theme-option:hover { background: var(--soft-bg); }

    .theme-option.active {
      background: var(--accent-soft);
      color: var(--accent-label);
    }

    .theme-option .check {
      opacity: 0;
      font-weight: 900;
    }

    .theme-option.active .check { opacity: 1; }

    .search-shell {
      margin-top: 0;
    }

    .search-toggle {
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 50%;
      padding: 0;
      display: grid;
      place-items: center;
      background: var(--soft-bg);
      color: var(--text);
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, transform .16s ease;
    }

    .search-toggle:hover {
      background: var(--accent-soft);
      border-color: rgba(109,93,252,.28);
    }

    .search-toggle:active {
      transform: scale(.96);
    }

    .search-toggle-icon {
      width: 18px;
      height: 18px;
      display: block;
    }

    .search-toggle-icon::before {
      content: "";
      display: block;
      width: 10px;
      height: 10px;
      border: 2px solid currentColor;
      border-radius: 50%;
      transform: translate(1px, 1px);
    }

    .search-toggle-icon::after {
      content: "";
      display: block;
      width: 7px;
      height: 2px;
      border-radius: 999px;
      background: currentColor;
      transform: translate(11px, 0px) rotate(45deg);
      transform-origin: left center;
    }

    .search-toggle-label,
    .search-toggle-arrow {
      display: none;
    }

    .search-panel {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      margin-top: 0;
      transition: grid-template-rows .2s ease, opacity .16s ease, margin-top .2s ease;
    }

    .search-panel.open {
      grid-template-rows: 1fr;
      opacity: 1;
      margin-top: 10px;
    }

    .search-panel-inner {
      min-height: 0;
      overflow: hidden;
    }

    .genre-search {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 9px;
    }

    .genre-input {
      width: 100%;
      min-width: 0;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 0 14px;
      outline: none;
      background: var(--card-strong);
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
      transition: border-color .16s ease, box-shadow .16s ease;
    }

    .genre-input::placeholder { color: var(--muted); }

    .genre-input:focus {
      border-color: rgba(109,93,252,.55);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .genre-submit {
      height: 44px;
      border: 0;
      border-radius: 14px;
      padding: 0 17px;
      cursor: pointer;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), #4f46e5);
      color: white;
      box-shadow: 0 10px 24px rgba(79,70,229,.22);
    }

    .genre-state {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 9px;
      padding: 8px 10px 8px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--soft-bg);
      color: var(--muted);
      font-size: 12px;
    }

    .genre-state.show { display: flex; }

    .genre-state strong { color: var(--text); }

    .genre-clear {
      border: 0;
      background: transparent;
      color: var(--accent-label);
      cursor: pointer;
      font-weight: 800;
      padding: 3px 5px;
    }

    @media (max-width: 640px) {
      .app { border: 0; }
      .topbar { padding-inline: 15px; }
      .card { padding-inline: 15px; }
      .word { font-size: 18px; }
      .summary { font-size: 14px; }
      .modal { padding: 0; align-items: flex-end; }
      .modal-panel {
        width: 100%;
        max-height: 88vh;
        border-radius: 22px 22px 0 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="topbar-row">
        <div>
          <h1>豆知識タイムライン</h1>
          <p class="subtitle">Wikipediaから毎回取得。知ると誰かに話したくなる豆知識を流し読み。</p>
        </div>
        <div class="topbar-actions">
          <button id="searchToggle" class="search-toggle" type="button"
            aria-label="検索を開く" aria-expanded="false" aria-controls="searchPanel">
            <span class="search-toggle-icon" aria-hidden="true"></span>
          </button>

          <div class="menu-wrap">
            <button id="menuButton" class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false">
              <span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span>
            </button>
            <div id="menuPanel" class="menu-panel" aria-hidden="true">
              <div class="menu-title">表示テーマ</div>
              <button class="theme-option" type="button" data-theme-option="light">
                <span>☀️ ライト</span><span class="check">✓</span>
              </button>
              <button class="theme-option" type="button" data-theme-option="dark">
                <span>🌙 ダーク</span><span class="check">✓</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="search-shell">
        <div id="searchPanel" class="search-panel" aria-hidden="true">
          <div class="search-panel-inner">
            <form id="genreForm" class="genre-search" role="search">
              <input id="genreInput" class="genre-input" type="search" autocomplete="off"
                placeholder="例：動物、宇宙、食べ物、歴史" aria-label="ジャンルまたはタイトル" />
              <button id="genreSubmit" class="genre-submit" type="submit">決定</button>
            </form>
          </div>
        </div>
      </div>

      <div id="genreState" class="genre-state" aria-live="polite">
        <span>表示中：<strong id="genreLabel"></strong></span>
        <button id="genreClear" class="genre-clear" type="button">解除</button>
      </div>

      <div class="tabs" aria-label="表示切り替え">
        <button class="tab active" data-tab="timeline">タイムライン</button>
        <button class="tab" data-tab="favorites">お気に入り</button>
      </div>
    </header>

    <section id="timeline" class="timeline" aria-live="polite"></section>

    <div id="loadMoreWrap" class="load-more-wrap">
      <button id="loadMoreBtn" class="load-more">さらに20件読み込む</button>
    </div>
  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-panel">
      <div class="modal-head">
        <h2 id="modalTitle" class="modal-title"></h2>
        <button id="closeModalBtn" class="close-btn" aria-label="閉じる">×</button>
      </div>
      <div class="modal-body">
        <section class="detail-block detail-overview">
          <div class="detail-label">概要</div>
          <p id="modalSummary" class="detail-summary"></p>
        </section>
        <section class="detail-block">
          <div class="detail-label">もう少し詳しく</div>
          <p id="modalText" class="detail-text"></p>
          <div id="detailLoading" class="detail-loading" hidden>詳しい解説を読み込み中…</div>
        </section>
        <div class="modal-actions">
          <a id="wikiLink" class="action primary" target="_blank" rel="noopener noreferrer">
            出典・参考を開く
          </a>
          <button id="modalFavBtn" class="action secondary">☆ お気に入りに保存</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const PAGE_SIZE = 20;
    const API = "https://ja.wikipedia.org/w/api.php";

    const timelineEl = document.getElementById("timeline");
    const loadMoreBtn = document.getElementById("loadMoreBtn");
    const loadMoreWrap = document.getElementById("loadMoreWrap");

    function cleanText(text="") {
      return text.replace(/\s+/g," ").replace(/\[[0-9]+\]/g,"").trim();

    function splitSentences(text="") {

    function sentenceScore(sentence, index) {
      let score = 0;

      // 「人に話したくなる一文」を優先する。
      if (/\d|[一二三四五六七八九十百千万億兆]+(?:年|個|本|匹|倍|%|％|km|m|cm|mm|kg|g|秒|分|時間|日|度|種類)/.test(sentence)) score += 3;
      if (/(世界初|日本初|史上初|初めて|最初|唯一|わずか|たった|実は|意外|珍しい|例外)/.test(sentence)) score += 10;
      if (/(最大|最小|最古|最長|最短|最速|最多|最高|最低|最も)/.test(sentence)) score += 7;
      if (/(由来|語源|命名|名付け|名前.*(?:から|に由来)|呼ばれるようになった)/.test(sentence)) score += 7;
      if (/(できない|しない|存在しない|持たない|逆に|一方で|にもかかわらず|通常とは異な|例外的)/.test(sentence)) score += 5;
      if (/(発見された|確認された|知られている|記録されている|という特徴|性質を持つ|能力を持つ)/.test(sentence)) score += 3;
      if (/(約|およそ|最大で|平均|以上|以下|未満|超える)/.test(sentence)) score += 2;

      // 「タコの足は8本」のような、シンプルで覚えやすい数字ファクトは特に強く優遇する。
      if (/(足|脚|腕|歯|目|眼|羽|翼|花びら|指|心臓|胃|触手|牙|角|羽根|房|節|色|種類|対|卵|骨|爪|鱗|鰭|翅|葉|枝|関節|脳|胃袋|心|耳|鼻|口|舌|尾|毛|殻|層)[はがの]{1,2}[^。、]{0,6}\d+(?:本|枚|匹|個|羽|房|節|色|種類?|対|つ|個体|層|重)(?:ある|あり|である|になる|存在する|持つ|備える)?/.test(sentence)) score += 6;

      // 「へえ、そうなんだ」を強く誘発するインパクト要素はさらに加点する。
      if (/(ギネス|世界記録|伝説|都市伝説|なんと|驚く|驚異|謎|不思議|禁止されて|タブー|奇跡|異常|矛盾)/.test(sentence)) score += 8;
      if (/(びっくり|衝撃|仰天|まさか|驚異的|伝説的|ユニーク|奇妙|風変わり|奇抜|信じられない|想像もつかない)/.test(sentence)) score += 8;
      if (/\d+(?:倍|分の1|パーセント|％|%)/.test(sentence)) score += 4;
      if (/(誤解され|勘違いされ|実際には|本当は|俗説|しばしば〜と思われがちだが|と思われがちだが)/.test(sentence)) score += 6;
      if (/(にちなんで|語呂合わせ|なぞらえて|皮肉|冗談|ジョーク)/.test(sentence)) score += 4;

      // 数値の羅列だけで意外性のない「スペック文」は弱くする。
      if (/^[^。]{0,60}(体長|全長|体重|身長|重さ|高さ|大きさ)[はが][^。]{0,40}(センチ|メートル|キロ|グラム|cm|m|kg|g)[^。]{0,20}。?$/.test(sentence) && !/(最大|最小|最長|最短|世界|日本|唯一|わずか)/.test(sentence)) score -= 4;

      // 普通の辞書的説明・沿革・固有名詞の羅列は弱くする。
      if (/^[^。]{0,55}(とは|は、|は)[^。]{0,90}(である|をいう|を指す|の一つである)。?$/.test(sentence)) score -= 9;
      if (/(設立された|開業した|発売された|公開された|所属している|本社を置く|所在地|人口は|面積は)/.test(sentence)) score -= 4;
      if (/(曖昧さ回避|一覧|カテゴリ|参照|脚注|外部リンク|出典|節を参照)/.test(sentence)) score -= 14;
      if (/^[「『].+[」』](?:は|とは)/.test(sentence) && sentence.length < 55) score -= 2;
      if (/(に分類される|に属する|の一種である|と呼ばれる分類群|学名は)/.test(sentence)) score -= 4;
      if (index === 0) score -= 3;
      if (sentence.length >= 32 && sentence.length <= 115) score += 3;
      if (sentence.length > 150) score -= 3;
      return score;
    }

    function hashString(str) {
      let h = 2166136261;
      for (let i=0;i<str.length;i++) { h ^= str.charCodeAt(i); h = Math.imul(h,16777619); }
      return (h>>>0).toString(36);
    }

    function factFingerprint(text = "") {
      return cleanText(text)
        .toLowerCase()
        .replace(/[\s、。！？!?,.「」『』（）()\[\]【】・:：;；]/g, "")
        .replace(/[0-9０-９]+/g, "#")
        .replace(/(である|です|ます|だった|という|とされる|ことがある|こともある)/g, "");
    }

    function ngrams(text, n = 3) {
      const t = factFingerprint(text);
      const out = new Set();
      if (t.length <= n) { if (t) out.add(t); return out; }
      for (let i = 0; i <= t.length - n; i++) out.add(t.slice(i, i+n));
      return out;
    }

    function similarity(a, b) {
      const A = ngrams(a), B = ngrams(b);
      if (!A.size || !B.size) return 0;
      let common = 0;
      for (const x of A) if (B.has(x)) common++;
      return common / Math.min(A.size, B.size);
    }

    function isTooSimilarToSeen(item) {
      const fp = factFingerprint(item.fact || item.title || item.summary);
      if (!fp) return true;
      return seenFactFingerprints.some(prev => similarity(fp, prev) >= 0.68);
    }

    function articleAnchor(title = "") {
      return title
        .replace(/[（(].*?[）)]/g, "")
        .replace(/一覧|曖昧さ回避/g, "")
        .trim();
    }

    function subjectHead(sentence = "") {
      const m = sentence.match(/^([^、。]{1,22}?)(?:は|が|では|には|も)[、]?/);
      return m ? m[1].replace(/^(また|なお|さらに|一方|しかし|ただし)/, "").trim() : "";
    }

    function isCandidateAboutArticle(sentence, articleTitle) {
      const anchor = articleAnchor(articleTitle);
      if (!anchor) return true;

      // 記事名が文中にある候補は最優先で許可。
      if (sentence.includes(anchor)) return true;

      // 「人間は〜」「イヌは〜」のように別の主語が明示されている文は、
      // その主語が記事名と無関係なら採用しない。
      const head = subjectHead(sentence);
      if (head) {
        const shortAnchor = anchor.replace(/[・\s]/g, "");
        const shortHead = head.replace(/[・\s]/g, "");
        if (!shortAnchor.includes(shortHead) && !shortHead.includes(shortAnchor)) return false;
      }

      // 主語省略文は記事本文の流れとして許可。ただし比較対象だけを語る文は除外。
      if (/^(人間|ヒト|男性|女性|子供|成人|イヌ|犬|ネコ|猫|ウサギ|兎|鳥類|魚類|哺乳類|昆虫|植物)(?:は|が|では|には|も)/.test(sentence)) return false;
      return true;
    }

    function neighborFitsArticle(sentence, articleTitle) {
      if (!sentence) return false;
      const anchor = articleAnchor(articleTitle);
      if (anchor && sentence.includes(anchor)) return true;
      const head = subjectHead(sentence);
      if (!head) return true;
      const a = anchor.replace(/[・\s]/g, "");
      const h = head.replace(/[・\s]/g, "");
      return !!a && (a.includes(h) || h.includes(a));
    }

    function contextualSentence(sentences, factIndex, articleTitle) {
      const fact = sentences[factIndex] || "";
      const candidates = [
        sentences[factIndex - 1] || "",
        sentences[factIndex + 1] || "",
        sentences[factIndex + 2] || ""
      ];
      const safe = candidates.find(s =>
        s &&
        s !== fact &&
        s.length >= 24 &&
        s.length <= 150 &&
        neighborFitsArticle(s, articleTitle) &&
        !/^(これ|それ|あれ|この|その|同じ|前者|後者|一方|また|なお|さらに|しかし|ただし)/.test(s)
      );
      return safe || "";
    }

    function makeExplanation(sentences, factIndex, articleTitle, displayFact) {
      const fact = displayFact || sentences[factIndex] || "";
      const context = contextualSentence(sentences, factIndex, articleTitle);
      const intro = sentences[0] || "";
      const introSafe = intro && intro !== sentences[factIndex] && intro.length <= 180
        ? intro
        : "";

      const parts = [
        `【豆知識】\n${fact}`,
        `【何についての話？】\nこれは「${articleTitle}」についての豆知識です。`
      ];

      if (context) parts.push(`【背景・補足】\n${context}`);
      else if (introSafe) parts.push(`【背景・補足】\n${introSafe}`);
      else parts.push(`【背景・補足】\n詳しい背景は出典記事で確認できます。`);

      return parts.join("\n\n");
    }

    function makeTriviaTitle(articleTitle, fact) {
      const anchor = articleAnchor(articleTitle) || cleanText(articleTitle) || "この項目";
      let sentence = normalizeFact(fact);

      // 前後を読まないと意味が通じない書き出しはタイトルにしない。
      sentence = sentence.replace(/^(また|なお|さらに|そして|一方|しかし|ただし)[、,]?/, "").trim();

      // 「足は〜」「寿命は〜」など、記事の主題が省略された属性文だけ記事名を補う。
      const attributeHead = sentence.match(/^([^、。]{1,14}?)(は|が)(.+[。！？])$/);
      if (!sentence.includes(anchor) && attributeHead) {
        const part = attributeHead[1];
        if (/^(足|脚|腕|目|眼|歯|心臓|脳|骨|首|舌|体長|全長|体重|寿命|速度|温度|直径|高さ|長さ|幅|名前|名称|語源|由来|色|数|個数|特徴|性質|生息地|分布|自転|公転)/.test(part)) {
          sentence = `${anchor}の${sentence}`;
        }
      }
      return sentence;
    }

    function normalizeFact(sentence) {
      return String(sentence || "")
        .replace(/^(また|なお|さらに|そして|一方|しかし|ただし)[、,]?/, "")
        .replace(/^このため[、,]?/, "")
        .trim();
    }

    // 数字＋助数詞のコアな事実が出た直後の読点より後ろ（補足説明）を削り、
    // 「タコの足は8本」のように言い切り型の短いタイトルにする。
    function trimToCoreFact(text) {
      const m = text.match(/^(.{4,40}?\d+(?:本|枚|匹|個|羽|房|節|色|種類?|対|つ|人|台|冊|杯|粒|頭|尾|巻|皿|滴|回|倍|個体|層|重)(?:ある|あり|いる|になる|存在する|持つ|備える)?)[、,].+([。！？])$/);
      if (m) return m[1] + (/[。！？]$/.test(m[1]) ? "" : m[2]);
      return text;
    }

    function isSelfContainedFact(sentence, articleTitle, relaxed = false) {
      const fact = normalizeFact(sentence);
      if (!fact || !/[。！？]$/.test(fact)) return false;
      if (/^(これ|それ|あれ|この|その|同じ|前者|後者|以上|以下|ここ|そこ|当時|その後|このため|そのため)/.test(fact)) return false;

      const anchor = articleAnchor(articleTitle);
      if (!anchor) return false;
      if (fact.includes(anchor)) return true;

      const head = subjectHead(fact);
      if (head) {
        const a = anchor.replace(/[・\s]/g, "");
        const h = head.replace(/[・\s]/g, "");
        if (a && (a.includes(h) || h.includes(a))) return true;
        // 主語が別物だと明示されている文は、緩和時でも採用しない。
        return false;
      }

      // 記事名を自然に補える属性文。
      if (/^(足|脚|腕|目|眼|歯|心臓|脳|骨|首|舌|体長|全長|体重|寿命|速度|温度|直径|高さ|長さ|幅|名前|名称|語源|由来|色|数|個数|特徴|性質|生息地|分布|自転|公転)(?:は|が)/.test(fact)) return true;

      // 20件を埋めるための第2段階。明示された別主語がなく、
      // 単独で意味が完結している強い事実文なら、記事名を主語として補う。
      return relaxed && fact.length >= 26 && fact.length <= 105;
    }

    function makeTriviaTitle(articleTitle, fact, relaxed = false) {
      const anchor = articleAnchor(articleTitle) || cleanText(articleTitle) || "この項目";
      let sentence = normalizeFact(fact);
      sentence = sentence.replace(/^(また|なお|さらに|そして|一方|しかし|ただし)[、,]?/, "").trim();

      const attributeHead = sentence.match(/^([^、。]{1,14}?)(は|が)(.+[。！？])$/);
      if (!sentence.includes(anchor) && attributeHead) {
        const part = attributeHead[1];
        if (/^(足|脚|腕|目|眼|歯|心臓|脳|骨|首|舌|体長|全長|体重|寿命|速度|温度|直径|高さ|長さ|幅|名前|名称|語源|由来|色|数|個数|特徴|性質|生息地|分布|自転|公転)/.test(part)) {
          return trimToCoreFact(`${anchor}の${sentence}`);
        }
      }

      if (sentence.includes(anchor) || subjectHead(sentence)) return trimToCoreFact(sentence);
      if (relaxed) return trimToCoreFact(`${anchor}は、${sentence}`);
      return trimToCoreFact(sentence);
    }

    function pageToTriviaList(page, maxItems=2, options={}) {
      const relaxed = !!options.relaxed;
      const minScore = Number.isFinite(options.minScore) ? options.minScore : (relaxed ? 3 : 10);
      const extract = cleanText(page.extract || "");
      const sentences = splitSentences(extract);
      if (sentences.length < 2) return [];

      const ranked = sentences
        .map((sentence,index)=>({ sentence, index, score: sentenceScore(sentence,index) }))
        .filter(x=>x.score >= minScore)
        .filter(x=>x.sentence.length <= (relaxed ? 110 : 96))
        .filter(x=>isCandidateAboutArticle(x.sentence, page.title))
        .filter(x=>isSelfContainedFact(x.sentence, page.title, relaxed))
        .sort((a,b)=>b.score-a.score);

      if (!ranked.length) return [];

      const chosen = [];
      for (const candidate of ranked) {
        if (chosen.length >= maxItems) break;
        const fact = normalizeFact(candidate.sentence);
        const title = makeTriviaTitle(page.title, fact, relaxed);
        if (title.length < 6 || title.length > 135) continue;
        if (chosen.some(x=>Math.abs(x.index-candidate.index)<=1)) continue;
        chosen.push({...candidate, fact, title});
      }

      return chosen.map(candidate=>{
        const context = contextualSentence(sentences, candidate.index, page.title);
        const summary = context || `この事実は「${page.title}」の記事本文に記載されています。`;
        return {
          id: `${page.pageid}-${hashString(candidate.fact)}`,
          pageid: page.pageid,
          articleTitle: page.title,
          title: candidate.title,
          fact: candidate.fact,
          summary,
          detail: makeExplanation(sentences,candidate.index,page.title,candidate.title),
          source: page.fullurl || `https://ja.wikipedia.org/?curid=${page.pageid}`,
          sourceName: "Wikipedia",
          triviaScore: candidate.score
        };
      });
    }

    async function fetchWithTimeout(url, timeoutMs = 9000) {
      let timer;
      const timeout = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error("タイムアウトしました")), timeoutMs);
      });
      try {
        return await Promise.race([fetch(url), timeout]);
      } finally {
        clearTimeout(timer);
      }
    }

    async function fetchPagesByIds(ids) {
      if (!ids.length) return [];
      const params = new URLSearchParams({
        origin:"*", action:"query", format:"json", pageids:ids.join("|"),
        prop:"extracts|info", explaintext:"1", inprop:"url", exsectionformat:"plain"
      });
      const response = await fetchWithTimeout(`${API}?${params.toString()}`, 9000);
      if (!response.ok) throw new Error("Wikipedia本文を取得できませんでした。");
      const data = await response.json();
      return data?.query?.pages ? Object.values(data.query.pages) : [];
    }

    async function fetchRandomCandidates(limit=50) {
      const params = new URLSearchParams({
        origin:"*", action:"query", format:"json", generator:"random", grnnamespace:"0", grnlimit:String(limit),
        prop:"extracts|info", explaintext:"1", inprop:"url", exsectionformat:"plain"
      });
      const response = await fetchWithTimeout(`${API}?${params.toString()}`, 9000);
      if (!response.ok) throw new Error("Wikipedia APIに接続できませんでした。");
      const data = await response.json();
      return data?.query?.pages ? Object.values(data.query.pages) : [];
    }

    async function fetchSearchCandidates(query, limit=50, offsetOverride=null) {
      const offset = offsetOverride === null ? searchOffset : offsetOverride;
      const searchParams = new URLSearchParams({
        origin:"*", action:"query", format:"json", list:"search", srsearch:query,
        srnamespace:"0", srlimit:String(limit), sroffset:String(offset), srprop:"", utf8:"1"
      });
      const response = await fetchWithTimeout(`${API}?${searchParams.toString()}`, 9000);
      if (!response.ok) throw new Error("Wikipedia検索に失敗しました。");
      const data = await response.json();
      const results = data?.query?.search || [];
      if (offsetOverride === null) searchOffset = data?.continue?.sroffset || 0;
      return fetchPagesByIds(results.map(x=>x.pageid));
    }

    const TRIVIA_CATEGORIES = [

      ]},
      { key:"food", label:"食べ物", queries:[
        '食べ物 料理 由来 意外', '果物 野菜 香辛料 誤解 実は', 'incategory:"食品" 由来 珍しい'
      ]},
      { key:"history", label:"歴史", queries:[
        '歴史 世界初 日本初 意外', '古代 中世 近代 意外 逸話', '発祥 起源 歴史 実は'
      ]},
      { key:"geography", label:"地理", queries:[
        '国 都市 島 山 川 珍しい 記録', '世界 最大 最小 国 意外', '自然地理 珍しい 不思議'
      ]},
      { key:"science", label:"科学", queries:[
        '科学 現象 不思議 発見', '物理 化学 珍しい 現象', '元素 物質 意外な性質'
      ]},
      { key:"language", label:"言葉", queries:[
        '言葉 語源 意外 由来 日本語', '名称 命名 語源 面白い', '外来語 語源 誤解'
      ]},
      { key:"inventions", label:"発明", queries:[
        '発明 技術 世界初 偶然', '道具 機械 発明 逸話', '技術史 初めて 意外'
      ]},
      { key:"culture", label:"文化", queries:[
        '文化 習慣 風習 由来 意外', '祭り 伝統 文化 起源 珍しい', '世界 文化 習慣 珍しい タブー'
      ]},
      { key:"nature", label:"自然", queries:[
        '自然 現象 気象 海洋 珍しい', '雷 雲 雪 火山 地震 不思議', '地球 自然現象 謎'
      ]},
      { key:"plants", label:"植物", queries:[
        '植物 花 木 生態 珍しい', '植物 珍しい 性質 不思議', 'incategory:"植物" 珍しい'
      ]},
      { key:"art", label:"芸術", queries:[
        '美術 音楽 建築 由来 逸話', '絵画 楽器 建築 意外な話', '芸術 技法 起源 珍しい'
      ]},
      { key:"everyday", label:"身近なもの", queries:[
        '日用品 身近なもの 由来 意外', '衣服 家具 道具 起源 珍しい', '生活用品 名前 由来 誤解'
      ]}
    ];

    function shuffledCategories(round = 0) {
      const list = [...TRIVIA_CATEGORIES];
      // 読み込み回ごとに開始ジャンルをずらし、同じ並びに固定しない。
      const shift = round % list.length;
      return list.slice(shift).concat(list.slice(0, shift));
    }

    async function fetchCategoryCandidates(category, round, perQueryLimit=24) {
      const queryIndex = Math.floor(round / TRIVIA_CATEGORIES.length) % category.queries.length;
      const query = category.queries[queryIndex];
      const cycle = Math.floor(round / (TRIVIA_CATEGORIES.length * category.queries.length));
      const offset = ((cycle * 37 + round * 13 + queryIndex * 11) % 18) * 10;
      const pages = await fetchSearchCandidates(query, perQueryLimit, offset);
      return pages.map(page => ({...page, _triviaCategory: category.key, _triviaCategoryLabel: category.label}));
    }

    function attachCategory(items, page) {
      return items.map(item => ({
        ...item,
        category: page._triviaCategory || "other",
        categoryLabel: page._triviaCategoryLabel || "その他"
      }));
    }

    async function getExternalTrivia(count=PAGE_SIZE) {
      const collected = [];
      const usedThisBatch = new Set();

      function acceptItem(page, item, allowSimilar = false) {
        if (!item) return false;
        if (seenKeys.has(item.id)) return false;
        if (!allowSimilar && isTooSimilarToSeen(item)) return false;
        seenKeys.add(item.id);
        seenFactFingerprints.push(factFingerprint(item.fact || item.title));
        if (seenFactFingerprints.length > MAX_SEEN_FINGERPRINTS) seenFactFingerprints.shift();
        seenArticleIds.add(page.pageid);
        usedThisBatch.add(page.pageid);
        collected.push(item);
        return true;
      }

      if (currentGenre) {
        let attempts = 0;
        while (collected.length < count && attempts < 12) {
          const pages = await fetchSearchCandidates(currentGenre, 50);
          if (!pages.length) break;
          for (const page of pages) {
            if (collected.length >= count) break;
            if (!page.title || !page.extract || page.extract.length < 120) continue;
            if (/(一覧|曖昧さ回避|索引|年表|人物一覧|作品一覧)$/.test(page.title)) continue;
            if (seenArticleIds.has(page.pageid) || usedThisBatch.has(page.pageid)) continue;

            let candidates = pageToTriviaList(page, 2);
            if (!candidates.length) candidates = pageToTriviaList(page, 2, {relaxed:true, minScore:5});
            for (const item of candidates) {
              if (acceptItem(page, item)) break;
            }
          }
          attempts++;
        }
        saveSeenHistory();
        return collected.slice(0,count);
      }

      // 第1段階: 質を優先した厳しい条件で集める。
      let attempts = 0;
      while (collected.length < count && attempts < 8) {
        let pages = [];
        try { pages = await fetchRandomCandidates(50); }
        catch (error) { console.warn("ランダム記事の取得をスキップ:", error); attempts++; continue; }

        for (let i=pages.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [pages[i],pages[j]]=[pages[j],pages[i]]; }
        for (const page of pages) {
          if (collected.length >= count) break;
          if (!page.title || !page.extract || page.extract.length < 140) continue;
          if (/(一覧|曖昧さ回避|索引|年表|人物一覧|作品一覧|ディスコグラフィ|作品リスト)$/.test(page.title)) continue;
          if (seenArticleIds.has(page.pageid) || usedThisBatch.has(page.pageid)) continue;
          const candidates = pageToTriviaList(page, 2);
          const viable = candidates.filter(x => !seenKeys.has(x.id) && !isTooSimilarToSeen(x));
          if (!viable.length) continue;
          const topPool = viable.slice(0, Math.min(2, viable.length));
          acceptItem(page, topPool[Math.floor(Math.random()*topPool.length)]);
        }
        attempts++;
      }

      // 第2段階: 20件に届かないときだけ、意味の完結性を保ったまま条件を緩める。
      let fillAttempts = 0;
      while (collected.length < count && fillAttempts < 10) {
        let pages = [];
        try { pages = await fetchRandomCandidates(50); }
        catch (error) { console.warn("補充候補の取得をスキップ:", error); fillAttempts++; continue; }

        for (let i=pages.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [pages[i],pages[j]]=[pages[j],pages[i]]; }
        for (const page of pages) {
          if (collected.length >= count) break;
          if (!page.title || !page.extract || page.extract.length < 110) continue;
          if (/(一覧|曖昧さ回避|索引|年表|人物一覧|作品一覧|ディスコグラフィ|作品リスト)$/.test(page.title)) continue;
          if (seenArticleIds.has(page.pageid) || usedThisBatch.has(page.pageid)) continue;
          const candidates = pageToTriviaList(page, 2, {relaxed:true, minScore:5});
          const item = candidates.find(x => !seenKeys.has(x.id) && !isTooSimilarToSeen(x));
          if (item) acceptItem(page, item);
        }
        fillAttempts++;
      }

      // 第3段階: 過去履歴との「似ている」判定だけを外して20件を優先。
      // 同一記事・同一IDは引き続き禁止する。
      let finalAttempts = 0;
      while (collected.length < count && finalAttempts < 5) {
        let pages = [];
        try { pages = await fetchRandomCandidates(50); }
        catch { finalAttempts++; continue; }
        for (const page of pages) {
          if (collected.length >= count) break;
          if (!page.title || !page.extract || page.extract.length < 100) continue;
          if (seenArticleIds.has(page.pageid) || usedThisBatch.has(page.pageid)) continue;
          const candidates = pageToTriviaList(page, 1, {relaxed:true, minScore:3});
          const item = candidates.find(x => !seenKeys.has(x.id));
          if (item) acceptItem(page, item, true);
        }
        finalAttempts++;
      }

      discoveryRound += 1;
      saveSeenHistory();
      for (let i=collected.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [collected[i],collected[j]]=[collected[j],collected[i]]; }
      return collected.slice(0,count);
    }

    function createCard(item){
      const article=document.createElement("article"); article.className="card"; article.tabIndex=0; article.setAttribute("role","button"); article.setAttribute("aria-label",`${item.title}の解説を見る`);
      const head=document.createElement("div"); head.className="card-head";
      const content=document.createElement("div"); content.style.minWidth="0";
      const title=document.createElement("h2"); title.className="word"; title.textContent=item.title;
      const summary=document.createElement("p"); summary.className="summary"; summary.textContent=item.summary;
      content.append(title,summary);
      const fav=document.createElement("button"); fav.className="fav-btn"+(isFavorite(item)?" active":""); fav.type="button"; fav.title=isFavorite(item)?"お気に入りから外す":"お気に入りに保存"; fav.textContent=isFavorite(item)?"♥":"♡"; fav.addEventListener("click",e=>{e.stopPropagation();toggleFavorite(item);});
      head.append(content,fav);
      const meta=document.createElement("div"); meta.className="meta";
      const source=document.createElement("span"); source.className="wiki-label"; source.textContent=`Wikipedia / ${item.articleTitle}`;
      const more=document.createElement("span"); more.textContent="解説を読む →";
      meta.append(source,more); article.append(head,meta);
      article.addEventListener("click",()=>openModal(item)); article.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openModal(item);}});
      return article;
    }

    function render(){
      timelineEl.innerHTML="";
      const data=currentTab==="timeline"?items:getFavorites();
      if(!data.length){ const empty=document.createElement("div"); empty.className="empty-note"; empty.textContent=currentTab==="favorites"?"まだお気に入りはありません。カードの♡ボタンから保存できます。":"外部から豆知識を取得しています。"; timelineEl.appendChild(empty); }
      else data.forEach(item=>timelineEl.appendChild(createCard(item)));
      loadMoreWrap.style.display=currentTab==="timeline"?"block":"none";
    }

    function showLoading(initial=false){
      if(initial) timelineEl.innerHTML=`<div class="status"><div class="spinner"></div>Wikipediaから豆知識候補を探しています…</div>`;
      loadMoreBtn.disabled=true;
      loadMoreBtn.textContent="外部から取得中…";
    }

    async function loadMore(initial=false){
      if(loading) return;
      loading=true;
      showLoading(initial && items.length===0);
      try{
        const batch=await getExternalTrivia(PAGE_SIZE);
        items.push(...batch);
        render();
        loadMoreBtn.textContent=batch.length?"さらに20件読み込む":"別の候補を探す";
      }catch(error){
        console.error(error);
        if(!items.length) timelineEl.innerHTML=`<div class="status">外部データの取得に失敗しました。<br><br>通信環境を確認して再試行してください。</div>`;
        loadMoreBtn.textContent="再試行する";
      }finally{
        loading=false;
        loadMoreBtn.disabled=false;
      }
    }

    function openModal(item){ activeItem=item; modalTitle.textContent=item.title; modalSummary.textContent=item.summary; modalText.textContent=item.detail; detailLoading.hidden=true; wikiLink.href=item.source; wikiLink.textContent=`出典：${item.sourceName}「${item.articleTitle}」`; wikiLink.style.display="inline-flex"; updateModalFavoriteButton(); modal.classList.add("show"); modal.setAttribute("aria-hidden","false"); document.body.style.overflow="hidden"; }
    function closeModal(){modal.classList.remove("show");modal.setAttribute("aria-hidden","true");document.body.style.overflow="";activeItem=null;}
    function updateModalFavoriteButton(){if(!activeItem)return; const fav=isFavorite(activeItem); modalFavBtn.textContent=fav?"♥ お気に入りから外す":"☆ お気に入りに保存";}
    modalFavBtn.addEventListener("click",()=>activeItem&&toggleFavorite(activeItem));
    closeModalBtn.addEventListener("click",closeModal); modal.addEventListener("click",e=>{if(e.target===modal)closeModal();}); document.addEventListener("keydown",e=>{if(e.key==="Escape"&&modal.classList.contains("show"))closeModal();});

    tabs.forEach(tab=>tab.addEventListener("click",()=>{currentTab=tab.dataset.tab;tabs.forEach(t=>t.classList.toggle("active",t===tab));render();}));
    loadMoreBtn.addEventListener("click",()=>loadMore(false));
    genreForm.addEventListener("submit",e=>{e.preventDefault(); currentGenre=genreInput.value.trim(); searchOffset=0; items=[]; genreLabel.textContent=currentGenre||"すべて"; genreState.classList.toggle("show",!!currentGenre); setSearchOpen(false); loadMore(true);});
    genreClear.addEventListener("click",()=>{currentGenre="";genreInput.value="";genreState.classList.remove("show");searchOffset=0;items=[];loadMore(true);});

    loadMore(true);
  </script>
